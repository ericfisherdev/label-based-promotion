name: Tests

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: promotion PRs opened by GITHUB_TOKEN start as drafts
    # and trigger no workflows. Marking them ready runs the checks.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash tests/run.sh
