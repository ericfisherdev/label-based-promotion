# When a PR merges into qa, move the testing PR with the same head commit
# from ready-for-qa to promoted-to-qa.
name: Mark promoted

on:
  pull_request_target:
    types: [closed]
    branches: [qa]

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  mark:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Default ref for pull_request_target: the base-branch commit that this
      # YAML came from, so the YAML and the scripts always match.
      - uses: actions/checkout@v5

      - run: .github/scripts/mark-promoted.sh "$PR_NUMBER" "$HEAD_REF" "$HEAD_SHA"
