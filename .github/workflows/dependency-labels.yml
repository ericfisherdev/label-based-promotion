# Reads "Depends on: #N" lines in the PR body. Adds depends-on-pr to this PR
# and is-dependency to each PR it names.
#
# pull_request_target: needs write access to labels. It reads the PR body as
# data only and never runs PR code.
name: Dependency labels

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Default ref for pull_request_target: the base-branch commit that this
      # YAML came from, so the YAML and the scripts always match.
      - uses: actions/checkout@v5

      - run: .github/scripts/sync-dependency-labels.sh "$PR_NUMBER"
